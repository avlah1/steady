; ESP32-CAM (AI Thinker): streams MJPEG at http://<ip>:81/stream for the vision worker.
; Based on Espressif's CameraWebServer example. Build + flash + watch:  pio run -t upload -t monitor
; Flashing needs the ESP32-CAM-MB USB board (or a USB-serial adapter with GPIO0 tied to GND).

[env:esp32cam]
platform = espressif32@7.1.3
board = esp32cam
framework = arduino
monitor_speed = 115200
