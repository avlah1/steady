; Box-3 audio check: beep, record 5 s, play it back. No Wi-Fi, no backend.
; Build + flash + watch:  pio run -t upload -t monitor   (from this folder)

[env:box3]
platform = espressif32@7.1.3
; "esp32s3box" is the original S3-Box; the pins that differ on the Box-3 are set in main.cpp.
board = esp32s3box
framework = arduino
monitor_speed = 115200
; The audio library needs C++17.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    https://github.com/pschatzmann/arduino-audio-driver.git#8a65c604ee1cc2471e4ae049a9e67355bb931a31
