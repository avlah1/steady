[project]
name = "steady"
version = "0.1.0"
description = "Fall-detection backend: incident state machine, voice check-in, caregiver alerts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=1.15.0",
    "faster-whisper>=1.2.1",
    "pymongo>=4.19.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "mediapipe>=1.1.1",
    "httpx>=0.28",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
